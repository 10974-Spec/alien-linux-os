# =====================================================================
#  Alien — master settings file
#  This is the ONE place to change the OS name, accent colour, etc.
#  After editing, rebuild with:   ./build/build.sh
# =====================================================================

# --- Identity --------------------------------------------------------
ALIEN_NAME="Alien"                 # Shown everywhere (boot menu, installer, About page)
ALIEN_ID="alien"                   # Lower-case id (no spaces) used in file names
ALIEN_VERSION="0.1"                # Bump this for each release
ALIEN_TAGLINE="Your world, your way."

# --- Look ------------------------------------------------------------
ALIEN_ACCENT="#4F8EF7"             # Accent colour used across the whole theme

# --- Base system -----------------------------------------------------
ALIEN_DEBIAN_SUITE="trixie"        # Debian release Alien is built on
ALIEN_MIRROR="http://deb.debian.org/debian"

# --- Region ----------------------------------------------------------
ALIEN_LOCALE="en_US.UTF-8"
ALIEN_KEYMAP="us"
ALIEN_TIMEZONE="Africa/Nairobi"

# --- Live session ----------------------------------------------------
ALIEN_HOSTNAME="alien"
ALIEN_LIVE_USER="alien"            # Username in the live (try-before-install) session
