        name: "MongoDB Community Server"
        summary: "Document-oriented NoSQL database for modern web applications"
        description: "MongoDB 8.0 is preinstalled with mongosh shell and database tools. Bound securely to localhost only. Controlled via Dev Services."
        icon: "mongodb"
        version: "8.0.32"
        size: "40 MB"
        installed_size: "120 MB"
        source: "MongoDB Official"
        featured: true
        is_preinstalled: true
