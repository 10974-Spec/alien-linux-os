bundles:
  - id: "jellyfin"
    name: "Jellyfin Media Server"
    summary: "The Free Software Media System for movies, TV, and music"
    description: "Installs and launches the Jellyfin media server. Stream to any device on your local network with zero tracking."
    icon: "multimedia-video-player"
    version: "Latest Stable"
    script: "enable-jellyfin.sh"
    port: 8096
    url: "http://localhost:8096"

  - id: "navidrome"
    name: "Navidrome Music Server"
    summary: "Modern personal music streaming server compatible with Subsonic"
    description: "Lightweight and fast personal audio streaming server. Stream your music library to mobile and desktop apps."
    icon: "multimedia-audio-player"
    version: "Latest Stable"
    script: "enable-navidrome.sh"
    port: 4533
    url: "http://localhost:4533"

  - id: "waydroid"
    name: "Waydroid Android Subsystem"
    summary: "Container-based approach to boot a full Android system on Linux"
    description: "Runs Android applications natively inside Linux container namespaces with direct hardware access (Wayland sessions)."
    icon: "phone"
    version: "Latest Stable"
    script: "enable-waydroid.sh"

  - id: "webapp"
    name: "Web App Creator"
    summary: "Turn any website into a standalone desktop application"
    description: "Create dedicated desktop launchers with custom icons and isolated browser windows for your favorite web tools."
    icon: "applications-internet"
    version: "Utility"
    script: "add-webapp.sh"
