        name: "Visual Studio Code"
        summary: "Code editing redefined — powerful, extensible code editor"
        description: "Visual Studio Code is a streamlined code editor with support for development operations like debugging, task running, and version control. Comes preinstalled with GPU-optimized settings for Alien OS."
        icon: "vscode"
        version: "1.141.0"
        size: "95 MB"
        installed_size: "360 MB"
        source: "Microsoft Official"
        featured: true
        is_preinstalled: true
        exec: "code"

      - id: "postgresql"
        package: "postgresql"
        name: "PostgreSQL Database"
        summary: "World's most advanced open source relational database"
        description: "PostgreSQL 17 is preinstalled and configured with local peer authentication for user 'alien'. Includes pgcli for interactive SQL queries. Controlled via Dev Services."
        icon: "postgresql"
        version: "17.0"
        size: "18 MB"
        installed_size: "65 MB"
        source: "Debian Trixie"
        featured: true
        is_preinstalled: true
        exec: "alien-dev-services"

